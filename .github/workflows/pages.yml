# Publishes the site to GitHub Pages on every push to main.
# The build tools in tools/ stay in the repository but are not published.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copy the site without tools/
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          rsync -a --exclude='/.git' --exclude='/.github' --exclude='/tools' ./ "$site/"
          test -f "$site/index.html"
          test -f "$site/404.html"
          test ! -e "$site/tools"
          echo "Files published: $(find "$site" -type f | wc -l)"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v5
